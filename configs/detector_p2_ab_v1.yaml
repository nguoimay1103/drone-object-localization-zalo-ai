experiment: yolo_p2_detector_ab_v1
data_root: /kaggle/input/datasets/phamnguyenanhtuan/data-train-yolo/yolo_dataset_doan_1
dataset_yaml_name: dataset.yaml
output_root: /kaggle/working/yolo_p2_detector_ab_v1
pretrained_weights: yolo11n.pt

variants:
  - name: p3_control
    architecture: configs/models/yolo_drone_ghost_p3.yaml
    expected_strides: [8, 16, 32]
  - name: p2_stride4
    architecture: configs/models/yolo_drone_ghost_p2.yaml
    expected_strides: [4, 8, 16, 32]

training:
  seed: 2026
  deterministic: true
  epochs: 70
  imgsz: 640
  batch_per_gpu: 16
  workers_per_rank: 2
  optimizer: auto
  patience: 100
  lr0: 0.003
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3.0
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1
  box: 7.5
  cls: 0.5
  dfl: 1.5
  close_mosaic: 10
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 5.0
  translate: 0.1
  scale: 0.5
  shear: 2.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  mosaic: 1.0
  mixup: 0.05
  copy_paste: 0.0
  amp: true
  cache: false
  rect: false
  multi_scale: false
  max_det: 300
